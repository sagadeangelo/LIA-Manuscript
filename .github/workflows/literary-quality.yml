name: Literary quality regression

on:
  push:
    branches: [work/modelos-ollama-y-progreso]
    paths:
      - 'backend/**'
      - '.github/workflows/literary-quality.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/literary-quality.yml'

permissions:
  contents: read

jobs:
  deterministic-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-studio.txt
      - name: Install portable book exporter
        run: sudo apt-get update && sudo apt-get install -y pandoc fonts-dejavu-core
      - name: Run staging account, editorial and simulated billing regression
        working-directory: backend
        run: python -m pytest -q tests/test_studio.py
      - name: Check Python compilation
        run: python -m compileall -q backend/app backend/tests
      - name: Run literary tests (simulated model, real HTTP and SQLite)
        run: python backend/tests/run_literary_quality.py --report artifacts/literary-quality.json
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: literary-quality-regression
          path: artifacts/literary-quality.json
          if-no-files-found: warn
